name = "worldpulse-api"
main = "src/index.ts"
compatibility_date = "2026-02-01"

# Workers Observability: Cloudflare Dashboard でログ検索（無料枠で約7日保持）
[observability]
enabled = true

# M11: level=error / exception を observability-tail Worker に流して Notion 観測性 DB に記録
[[tail_consumers]]
service = "observability-tail"

# cron の異常を observability-tail の POST /obs-notify に送る (src/lib/obs-notify.ts)。
# 同じアカウントの Worker 同士は workers.dev の URL に fetch できない (error 1042) ので Service binding で呼ぶ
[[services]]
binding = "OBS"
service = "observability-tail"

[triggers]
crons = ["0 15 * * *"]  # 15:00 UTC = 00:00 JST

[[d1_databases]]
binding = "DB"
database_name = "worldpulse"
database_id = "4434a125-2ad3-406b-a83c-710c33fbfa71"

[vars]
CORS_ORIGIN = "https://worldpulse.pages.dev"
