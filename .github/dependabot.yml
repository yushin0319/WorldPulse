version: 2
updates:
  # root (npm-only deps) + frontend (Astro app, vitest 4.x 系で運用中) は通常通り
  # 全 update を受け入れる。frontend では vitest CVE-2026-47429 を ^4.1.0 へ patch
  # update で解消済み (本 PR 同梱)。
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # worker (Cloudflare Worker) も vitest 4.x へ移行済み。vitest-pool-workers
  # 0.16.x が vitest ^4.1.0 を peer 必須とし、config API も cloudflareTest
  # plugin 方式に刷新されたため、3.x ロックを解除して通常 update を受ける。
  - package-ecosystem: "npm"
    directories:
      - "/worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
