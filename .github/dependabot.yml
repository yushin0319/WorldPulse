version: 2
updates:
  # root / frontend / worker の全 update を受け入れる。
  # worker は @cloudflare/vitest-plugin (旧 @cloudflare/vitest-pool-workers) で
  # workerd 上でテストする。vitest 5 との組み合わせは worker/vitest.config.ts の
  # new_module_registry フラグが前提 (理由は同ファイルのコメント参照)。
  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/frontend"
      - "/worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # vitest 本体と、vitest を peerDependencies に持つ連動パッケージを 1 PR に
      # まとめる。別 PR に分かれると単独では peer 不整合になりマージできない
      # (#196: vitest 5 単独 bump で worker-test が失敗)。
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@cloudflare/vitest-plugin"
