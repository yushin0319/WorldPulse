version: 2
updates:
  # root / frontend / worker とも vitest 4.x で運用し、全 update を受け入れる。
  # worker の vitest-pool-workers 0.16.x (vitest4) は 0.16.15 に workerd 上で
  # @vitest/utils の assertTypes を解決できない upstream バグがあるが、
  # worker/vitest.config.ts の deps.optimizer.ssr で @vitest/utils を
  # pre-bundle して回避済み。
  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/frontend"
      - "/worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # react と react-dom は完全に同一バージョンである必要がある
      # (不一致だと react-dom が "Incompatible React versions" で throw する)。
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # hono は /frontend と /worker の両方に入っており、frontend は worker の
      # AppType を hc<AppType>() で参照する。別 PR で片方だけ上がるとバージョン差で
      # 型が合わず frontend-test が TS2344 で落ちる (2026-09-03〜09-10 に実際に発生)。
      hono:
        patterns:
          - "hono"
          - "@hono/*"
      # vite と @vitejs/* は peer で結びついている (plugin-react 6 の peer は vite ^8)。
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      # vitest 本体と @vitest/* は peer をバージョン厳密指定するため 1 PR にまとめる。
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
