name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dependabot の自動マージ (github-actions のトークン) では push が起動しないので、
  # main で手動実行して Test → Deploy (workflow_run) を走らせる口
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bunx @biomejs/biome check .

  worker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: worker
      - run: bunx vitest run
        working-directory: worker

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun install --frozen-lockfile
        working-directory: worker
      - run: bunx vitest run
        working-directory: frontend
      - run: bunx tsc -b
        working-directory: frontend
      - run: bunx vite build
        working-directory: frontend
