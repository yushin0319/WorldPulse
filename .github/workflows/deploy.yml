name: Deploy

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]

env:
  # 観測性イベントの受け口 (observability-tail Worker の POST /obs-notify)。デプロイ失敗をここに送る
  OBS_NOTIFY_ENDPOINT: https://observability-tail.y-fudo.workers.dev/obs-notify

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: worker
      - name: wrangler deploy (with Sentry release tag)
        run: bunx wrangler deploy --var SENTRY_RELEASE:${{ github.sha }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Notify obs-notify on failure
        if: failure()
        run: |
          if [ -z "$OBS_WEBHOOK_SECRET" ]; then
            echo "::warning::OBS_WEBHOOK_SECRET が未設定のため obs-notify に送りません"
            exit 0
          fi
          curl -sS --fail-with-body --max-time 30 -X POST "$OBS_NOTIFY_ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: $OBS_WEBHOOK_SECRET" \
            -d '{"severity":"warning","service":"github-actions","repo":"WorldPulse","subject":"⚠ WorldPulse Worker デプロイ失敗","summary":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}","url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
        env:
          OBS_WEBHOOK_SECRET: ${{ secrets.OBS_WEBHOOK_SECRET }}

  deploy-frontend:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: worker
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bunx tsc -b
        working-directory: frontend
      - run: bunx vite build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # CARTO の地図タイルの無料キー (https://carto.com/basemaps/apikey)。無いと透かし画像になる
          VITE_CARTO_KEY: ${{ secrets.VITE_CARTO_KEY }}
      - run: bunx wrangler pages deploy dist --project-name=worldpulse --commit-message="deploy ${{ github.sha }}"
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Notify obs-notify on failure
        if: failure()
        run: |
          if [ -z "$OBS_WEBHOOK_SECRET" ]; then
            echo "::warning::OBS_WEBHOOK_SECRET が未設定のため obs-notify に送りません"
            exit 0
          fi
          curl -sS --fail-with-body --max-time 30 -X POST "$OBS_NOTIFY_ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: $OBS_WEBHOOK_SECRET" \
            -d '{"severity":"warning","service":"github-actions","repo":"WorldPulse","subject":"⚠ WorldPulse Frontend デプロイ失敗","summary":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}","url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
        env:
          OBS_WEBHOOK_SECRET: ${{ secrets.OBS_WEBHOOK_SECRET }}
